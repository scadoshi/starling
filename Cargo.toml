[package]
name = "starling"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29.0"
crossterm = "0.28.1"
dotenvy = "0.15"
dirs = "6"
anyhow = "1.0"
chrono = "0.4.42"
notify-rust = "4"
